<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <script>
      // aplica o tema antes da primeira pintura, para a tela não piscar na cor errada
      (function () {
        try {
          var t = localStorage.getItem('ingles-hibrido:tema');
          if (t !== 'claro' && t !== 'escuro') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
          }
          document.documentElement.dataset.tema = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = t === 'claro' ? '#ece3d0' : '#0d0d0d';
        } catch (e) {}
      })();
    </script>
    <title>Inglês Híbrido</title>
    <!-- ícone do app: o gato com o caderno (favicon, atalho no celular e app instalado) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Eita" />
    <meta name="application-name" content="Eita" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
